<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ DS - Takdir Yang Memisahkan Kita</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0a;color:white;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    padding:20px;
    background: radial-gradient(circle at 50% 0%, #ff550030, #000 70%);
  }
  .card{
    background:#111;border-radius:24px;max-width:420px;width:100%;
    overflow:hidden;border:1px solid #222;
    box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 40px rgba(255,85,0,0.15);
  }
  .cover-wrap{width:100%;aspect-ratio:1/1;background:#000;position:relative}
  .cover-wrap img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
  .info{padding:20px}
  .badge{display:inline-block;background:#ff5500;color:white;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;margin-bottom:12px;letter-spacing:0.5px}
  h1{font-size:20px;line-height:1.3;font-weight:800;margin-bottom:6px}
  .artist{color:#999;font-size:14px;margin-bottom:18px}
  .btns{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;text-align:center;padding:12px;border-radius:30px;text-decoration:none;font-weight:700;font-size:14px}
  .btn-primary{background:#ff5500;color:white}
  .btn-secondary{background:#222;color:white;border:1px solid #333}
  .note{font-size:11px;color:#666;margin-top:12px;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <div class="cover-wrap">
      <!-- KLIK FOTO = LANGSUNG KE SOUNDCLOUD LU -->
      <a href="https://on.soundcloud.com/e8nWqZf0rgLWC0ajs3" target="_blank">
        <img src="soundcloud-logo.png" alt="Cover - Takdir Yang Memisahkan Kita">
      </a>
    </div>
    <div class="info">
      <div class="badge">FUNKOT IBU MENTERI SPECIAL</div>
      <h1>TAKDIR YANG MEMISAHKAN KITA</h1>
      <div class="artist">DJ DS OFFICIAL • Rahmad Pratama • 51:03</div>
      
      <div class="btns">
        <a href="https://on.soundcloud.com/e8nWqZf0rgLWC0ajs3" class="btn btn-primary" target="_blank">▶️ PUTAR SEKARANG</a>
        <a href="https://github.com/tamayana/tama-music" class="btn btn-secondary" target="_blank">GitHub</a>
      </div>
      <div class="note">Tap foto di atas untuk putar • Cover FULL 1400x1400</div>
    </div>
  </div>
</body>
</html>
