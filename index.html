<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ DS - Takdir Yang Memisahkan Kita</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 50% 0%, #ff550030, #000 70%)}
.card{background:#111;border-radius:28px;max-width:400px;width:100%;overflow:hidden;border:1px solid #222;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.cover{width:100%;aspect-ratio:1/1;background:#000}
.cover img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.info{padding:24px;text-align:center}
.badge{background:#ff5500;color:#fff;font-size:11px;font-weight:800;padding:6px 14px;border-radius:20px;display:inline-block;margin-bottom:14px}
h1{font-size:22px;font-weight:900;line-height:1.2}
p.artist{color:#888;font-size:14px;margin:8px 0 20px}
.btn{display:block;background:#ff5500;color:#fff;padding:16px;border-radius:50px;text-decoration:none;font-weight:900;font-size:16px}
small{color:#555;font-size:11px;display:block;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <div class="cover">
    <a href="https://on.soundcloud.com/L6I77wL02gSrJm3M1K" target="_blank">
      <img src="soundcloud-logo.png" alt="Cover">
    </a>
  </div>
  <div class="info">
    <div class="badge">FUNKOT IBU MENTERI SPECIAL</div>
    <h1>TAKDIR YANG MEMISAHKAN KITA</h1>
    <p class="artist">DJ DS OFFICIAL • Rahmad Pratama • 51:03</p>
    <a href="https://on.soundcloud.com/L6I77wL02gSrJm3M1K" class="btn" target="_blank">▶️ PUTAR DI SOUNDCLOUD</a>
    <small>Tap foto untuk putar musik</small>
  </div>
</div>
</body>
</html>
